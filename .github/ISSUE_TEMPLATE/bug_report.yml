name: Bug report
description: Report a reproducible problem with OpenCode CLI Setup.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, access tokens, private URLs, or personal data. For security vulnerabilities, follow SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Installer version
      description: For example, v1.0.0.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and PowerShell version
      placeholder: Windows 11 x64, Windows PowerShell 5.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error message, with sensitive details removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the launcher...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.
    validations:
      required: false
